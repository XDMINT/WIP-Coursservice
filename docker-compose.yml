version: '3.8'

services:
  courses-db:
    image: mysql:9.7.0
    container_name: courses-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=courses
      - MYSQL_USER=user
      - MYSQL_PASSWORD=root
    volumes:
      - courses-db-data:/var/lib/mysql

  courses-service:
    build:
      context: .
      dockerfile: ./services/apps/courses/Dockerfile
    container_name: courses-service
    environment:
      - DB_HOST=courses-db       # Wird zu process.env.DB_HOST
      - DB_PORT=3306             # Wird zu process.env.DB_PORT
      - DB_USER=courses_user     # Wird zu process.env.DB_USER
      - DB_PASS=root             # Wird zu process.env.DB_PASS
      - DB_NAME=courses          # Wird zu process.env.DB_NAME
    depends_on:
      - courses-db

  dagu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dagu
    volumes:
      - ./services/apps/workflow/dagu-workflows:/dagu/dags
    environment:
      - DAGU_AUTH_MODE=none
      - DAGU_DAGS=/dagu/dags

  workflow-service:
    build:
      context: .
      dockerfile: ./services/apps/workflow/Dockerfile
    container_name: workflow-service
    environment:
      - DAGU_API_URL=http://dagu:8080/api/v1
    depends_on:
      - dagu

  traefik:
    image: traefik:3.7.1
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8000"
      - "--accesslog=true"
      - "--providers.file.filename=/gateway/traefik.yaml"
      # hot reload
      - "--providers.file.watch=true"
    ports:
      - "8000:8000"
      - "8081:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./gateway:/gateway:ro"

volumes:
  courses-db-data: