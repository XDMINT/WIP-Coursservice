openapi: 3.0.3
info:
  title: Workflow API
  version: 1.0.0
  description: API for managing workflows und deren Ausführungen

paths:
  /workflows:
    get:
      summary: List workflows
      description: Gibt eine Liste aller verfügbaren Workflow-Definitionen (YAML-Baupläne) zurück.
      operationId: listWorkflows
      tags:
        - WorkflowService
      responses:
        '200':
          description: Liste der Workflow-Definitionen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowDefinitionDto'

  /workflows/{workflow_id}/run:
    parameters:
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Workflow starten
      operationId: triggerWorkflow
      tags:
        - WorkflowService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerWorkflowRequest'
      responses:
        '202':
          description: Workflow-Instanz erfolgreich gestartet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionDto'

  /executions:
    get:
      summary: Alle Workflow-Ausführungen auflisten
      description: Gibt die Historie aller gestarteten Workflows zurück.
      operationId: listExecutions
      tags:
        - WorkflowService
      responses:
        '200':
          description: Liste der Ausführungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowExecutionDto'

  /executions/{execution_id}:
    parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Status einer spezifischen Ausführung
      operationId: getExecutionState
      tags:
        - WorkflowService
      responses:
        '200':
          description: Details zur Ausführung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecutionDto'
        '404':
          description: Ausführung nicht gefunden
          content:
            application/json:
              schema:
                $ref: './shared-types.yaml#/components/schemas/ErrorResponse'

components:
  schemas:
    WorkflowExecutionDto:
      type: object
      required:
        - id
        - workflow_id
        - status
      properties:
        id:
          type: string
          description: Die eindeutige ID des Laufs (dagRunId)
        workflow_id:
          type: string
          description: Der Name des zugrunde liegenden Workflows (z.B. "init")
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED, RETRYING]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        triggered:
          type: boolean

    WorkflowDefinitionDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        parameter_schema:
          type: object
          nullable: true

    TriggerWorkflowRequest:
      type: object
      properties:
        parameters:
          type: object
          description: Key-Value Paare für die Dagu-Parameter