openapi: 3.0.3

info:
  title: Lernplattform Shared Types
  version: 1.0.0
  description: Shared types for the API

paths: {}

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          description: The timestamp of the error
        status:
          type: integer
          format: int32
          description: The HTTP status code of the error
        error:
          type: string
          description: The error message
        message:
          type: string
          description: Detailed error message
        path:
          type: string
          description: The path of the request that caused the error