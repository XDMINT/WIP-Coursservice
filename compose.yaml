services:
  traefik:
    image: traefik:3.7.1
    command:
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--log.format=json"
      - "--api.dashboard=false"
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy-network
    depends_on:
      frontend:
        condition: service_started
      course-service:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-/api}"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coursservice-proxy-network"
      traefik.http.routers.frontend.rule: "PathPrefix(`/`)"
      traefik.http.routers.frontend.entrypoints: "web"
      traefik.http.routers.frontend.priority: "1"
      traefik.http.services.frontend.loadbalancer.server.port: "80"
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5

  course-service:
    build:
      context: .
      dockerfile: apps/course-service/Dockerfile
    environment:
      APP_ENV: "${APP_ENV:-development}"
      PORT: "${BACKEND_INTERNAL_PORT:-3000}"
      DATABASE_HOST: "course-db"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "${COURSE_DB_NAME:-ewill_courses}"
      DATABASE_USER: "${COURSE_DB_USER:-ewill_courses}"
      DATABASE_PASSWORD: "${COURSE_DB_PASSWORD:-change-me}"
      DATABASE_SSL: "${DATABASE_SSL:-false}"
      DATABASE_MIGRATIONS_RUN: "${DATABASE_MIGRATIONS_RUN:-true}"
      COURSE_MATERIAL_STORAGE_PATH: "/app/storage/materials"
      COURSE_MATERIAL_MAX_FILE_SIZE_BYTES: "${COURSE_MATERIAL_MAX_FILE_SIZE_BYTES:-52428800}"
      TASK_SERVICE_URL: "http://task-service:3000"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coursservice-proxy-network"
      traefik.http.routers.course-service.rule: "Path(`/api`) || PathPrefix(`/api/`)"
      traefik.http.routers.course-service.entrypoints: "web"
      traefik.http.routers.course-service.priority: "100"
      traefik.http.services.course-service.loadbalancer.server.port: "${BACKEND_INTERNAL_PORT:-3000}"
    depends_on:
      course-db:
        condition: service_healthy
      task-service:
        condition: service_healthy
    volumes:
      - course-materials-data:/app/storage/materials
    networks:
      - proxy-network
      - course-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BACKEND_INTERNAL_PORT:-3000}/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  task-service:
    build:
      context: .
      dockerfile: apps/task-service/Dockerfile
    environment:
      PORT: "3000"
      TASK_SERVICE_DATA_DIR: "/app/data"
    volumes:
      - task-service-data:/app/data
    networks:
      - course-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5

  course-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${COURSE_DB_NAME:-ewill_courses}"
      POSTGRES_USER: "${COURSE_DB_USER:-ewill_courses}"
      POSTGRES_PASSWORD: "${COURSE_DB_PASSWORD:-change-me}"
    volumes:
      - course-postgres-data:/var/lib/postgresql/data
    networks:
      - course-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  course-postgres-data:
  course-materials-data:
  task-service-data:

networks:
  proxy-network:
    name: coursservice-proxy-network
  course-internal:
    name: coursservice-course-internal
    internal: true
